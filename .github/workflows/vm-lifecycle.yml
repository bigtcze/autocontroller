# Scheduled and manual disposable-VM lifecycle suite (systemd, lingering, reboot, Engram
# recovery). Runs vmtest/ against pinned official cloud images inside QEMU guests.
#
# Not a required check: it is not referenced from required.yml or regression.yml and
# never runs on pull requests or pushes. It holds no secrets and needs only read access.
# Results from this workflow are only as good as the last green run; see docs/VM_TESTING.md.
name: vm-lifecycle
on:
  schedule:
    - cron: '17 3 * * 1'   # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      distro:
        description: 'Distribution to run (all = every matrix entry)'
        type: choice
        options: [all, debian-12, debian-13, ubuntu-24.04, ubuntu-26.04]
        default: all
permissions:
  contents: read
# Never cancel a running VM suite: a cancelled guest run leaves no conclusive evidence.
concurrency:
  group: vm-lifecycle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # The `matrix` context is not available in job-level `if:`, so the single-distro input is
  # turned into the matrix here and consumed with fromJSON by the vm job.
  plan:
    name: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          DISTRO: ${{ inputs.distro || 'all' }}
        run: |
          if [ "$DISTRO" = all ]; then
            matrix='["debian-12","debian-13","ubuntu-24.04","ubuntu-26.04"]'
          else
            matrix="[\"$DISTRO\"]"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix: $matrix"

  vm:
    name: vm (${{ matrix.distro }})
    needs: [plan]
    runs-on: ubuntu-26.04
    # KVM run: about 6 minutes per distro (local runs). TCG fallback: expected to be far slower
    # and unmeasured; see docs/VM_TESTING.md. The job limit must not be raised silently.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install QEMU, UEFI firmware and SSH client
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils openssh-client ovmf

      - name: Enable KVM for the runner user, or fall back to TCG
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-vmtest-kvm.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            echo "accelerator: kvm expected (/dev/kvm present)"
          else
            echo "accelerator: no /dev/kvm; harness --accel auto will select TCG"
          fi

      - name: Run lifecycle scenario
        run: |
          python3 -m vmtest.harness run \
            --distro "${{ matrix.distro }}" \
            --artifacts "${{ runner.temp }}/vmtest-artifacts/${{ matrix.distro }}" \
            --cache "${{ runner.temp }}/vmtest-cache" \
            --accel auto

      - name: Upload artifacts (always, including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-lifecycle-${{ matrix.distro }}
          path: ${{ runner.temp }}/vmtest-artifacts/${{ matrix.distro }}
          retention-days: 14
          if-no-files-found: warn
