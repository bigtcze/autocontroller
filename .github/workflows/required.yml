name: required
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  required:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify Python and shell syntax
        run: |
          python3 --version
          python3 -m py_compile *.py
          bash -n install.sh
      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -v
