# Tag-triggered native release. Only the controller or owner pushes release tags;
# agents never create tags or releases. Artifact archives and checksums are owned
# by a later Issue and are intentionally absent here.
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    name: qualify
    uses: ./.github/workflows/regression.yml
  publish:
    name: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: [qualify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and ancestry on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-SemVer tag: $TAG" >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -f "docs/releases/$TAG.md" ]]; then
            notes=(--notes-file "docs/releases/$TAG.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" --verify-tag "${notes[@]}"
