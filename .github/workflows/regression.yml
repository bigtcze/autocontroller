# Reusable regression gate. Called by required.yml (PR/main) and release.yml
# (before publication). Holds no secrets and needs only read access.
#
# Clean distribution containers prove OS/Python compatibility only. They do NOT
# prove systemd, lingering, APT installation of the controller, reboot survival
# or live GitHub/OpenCode behaviour; those are covered by the live acceptance in
# docs/VALIDATION.md.
name: regression
on:
  workflow_call:
permissions:
  contents: read
jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Syntax checks
        run: bash scripts/check-syntax.sh

  distro:
    name: distro (${{ matrix.distro }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Images are pinned to multi-arch index digests (each contains linux/amd64); Renovate maintains them.
      matrix:
        include:
          - distro: debian:12
            image: debian:12@sha256:1d04200c2ece1d4d75a2a6f8e11ebce7d86a2ae28b34bb2c9cbb3ee9f4953e75
          - distro: debian:13
            image: debian:13@sha256:3cda3ca472ce45507a5109c6a3907093e24d9ae67d55954c9a07a45665dafba2
          - distro: ubuntu:24.04
            image: ubuntu:24.04@sha256:562111b88caa79c71391c0c4d3c2114a7d5c35915c20561fd893cb1e07929e6b
          - distro: ubuntu:26.04
            image: ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install minimal prerequisites (root, distribution python3)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 ca-certificates
          useradd --create-home --shell /bin/bash tester
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Make checkout readable by the unprivileged user
        run: |
          cp -a "$GITHUB_WORKSPACE" /src
          chown -R tester:tester /src
      - name: Report runtime
        run: |
          python3 --version
          cat /etc/os-release
      - name: Offline regression suite as unprivileged user
        run: runuser -u tester -- bash /src/scripts/offline-tests.sh

  mise:
    name: mise ci
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          install: true
      - name: mise run ci
        run: mise run ci
